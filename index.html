<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
<title>فستاني – تأجير الفساتين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7ebe8;--card:#fff;--rose:#b4756e;--rose2:#8f524e;--txt:#3b2a29;--mut:#8c726e;--line:#ecd9d5;--grad:linear-gradient(135deg,#c9908a,#93564f)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;width:100%;overflow-x:hidden;overscroll-behavior-x:none}img,svg,canvas{max-width:100%}button{padding:0}input,select{-webkit-appearance:none;appearance:none}
body{font-family:Tajawal,sans-serif;background:#f1dcd7;color:var(--txt);min-height:100vh}
#app{width:100%;overflow-x:clip;max-width:620px;margin:0 auto;background:var(--bg);min-height:100vh;padding:14px 16px 90px;position:relative}
button,input,select{font-family:inherit;font-size:15px;color:var(--txt)}
button{cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'Aref Ruqaa',serif;font-size:30px;color:var(--rose);text-align:center;line-height:1}
.logo small{display:block;font-size:11px}
.ic{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px #b4756e22}
.avatar{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.search{width:100%;padding:13px 18px;border-radius:30px;border:0;background:#fff;box-shadow:0 3px 12px #b4756e22;margin-bottom:16px}
h2{font-size:19px;margin:14px 0 10px}
.cats{display:flex;justify-content:space-between;gap:8px}
.cat{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--txt)}
.cat i{display:block;width:72px;height:72px;margin:0 auto 6px;border-radius:50%;background:#f1d4cf;overflow:hidden;border:2px solid transparent;box-shadow:0 3px 10px #b4756e22}.cat i img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}.lg{height:58px;width:auto;display:block;margin:0 auto}
.cat.on i{border-color:var(--rose)}
.hero{margin:14px 0;border-radius:18px;min-height:170px;background-size:cover;background-position:left center;position:relative;overflow:hidden;box-shadow:0 4px 14px #b4756e22;display:flex;align-items:center}.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(270deg,#f7ebe8cc 0%,#f7ebe880 45%,transparent 75%)}.ht{position:relative;padding:18px 20px;max-width:62%}.ht b{font-family:'Aref Ruqaa',serif;font-size:27px;color:var(--rose2);display:block;line-height:1.3}.ht p{font-size:14px;margin:4px 0 12px;color:var(--txt)}
.bn{position:relative;margin:14px 0;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px #b4756e22}.bn img{width:100%;display:block}.bn button{position:absolute;left:14%;top:44%;width:28%;height:34%}
.banner{margin:14px 0;border-radius:18px;padding:22px 20px;background:linear-gradient(120deg,#f4d9d4cc,#e7bdb6);position:relative;overflow:hidden}
.banner b{font-family:'Aref Ruqaa',serif;font-size:26px;color:var(--rose2);display:block}
.banner p{font-size:14px;margin:4px 0 12px}
.pill{background:#fff;border-radius:20px;padding:7px 16px;font-size:14px;color:var(--rose2);box-shadow:0 2px 6px #0001}
.row{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}#app{max-width:760px}}
.dc{background:#fff;border-radius:16px;padding:8px 8px 12px;box-shadow:0 4px 14px #b4756e1c;position:relative;cursor:pointer}
.dc img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;background:#eee}
.heart{position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;background:#fffd;display:flex;align-items:center;justify-content:center;color:var(--rose);font-size:17px}
.dc h3{font-size:16px;margin:8px 4px 2px}
.dc small{color:var(--mut);display:block;margin:0 4px}
.dc .pr{font-weight:700;color:var(--rose2);margin:6px 4px 0}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#fff;display:flex;justify-content:space-around;padding:8px 0 10px;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px #b4756e22;z-index:5}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);text-decoration:none;flex:1}
.nav a span{display:flex;align-items:center;justify-content:center;width:40px;height:36px}.nav a span svg{width:24px;height:24px}
.nav a.on{color:var(--rose2);font-weight:700}
.nav a.add span{background:var(--grad);color:#fff;border-radius:50%;width:40px;height:40px;margin-top:-4px;box-shadow:0 4px 10px #93564f44}.nav a.add span svg{width:22px;height:22px}
label{display:block;font-weight:500;margin:12px 0 6px}
.in{width:100%;padding:12px 16px;border-radius:26px;border:0;background:#fff;box-shadow:0 2px 8px #b4756e1a;outline:none}
.in:focus{box-shadow:0 0 0 2px var(--rose)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{border:2px dashed #c99a94;border-radius:18px;padding:18px;text-align:center;background:#f3dcd8;cursor:pointer}
.thumbs{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sz{padding:8px 18px;border-radius:20px;background:#fff;box-shadow:0 2px 6px #b4756e1a}
.sz.on{background:var(--grad);color:#fff}
.btn{width:100%;padding:14px;border-radius:30px;background:var(--grad);color:#fff;font-size:17px;font-weight:700;margin-top:18px;box-shadow:0 4px 12px #93564f44}
.btn.g{background:#3bb35f}.btn.s{margin:0;padding:12px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:0 0 22px 22px;margin:-14px -16px 0;scrollbar-width:none}
.gal img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/3.4;object-fit:cover;max-height:520px}
.back{position:absolute;top:22px;right:22px;z-index:2}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pills div{background:#fff;border-radius:22px;padding:13px 18px;box-shadow:0 2px 8px #b4756e1a}
.pills .w{grid-column:1/3}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px #b4756e1a;margin-bottom:12px}
.stars{color:#d9a441;letter-spacing:1px}
.mine{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 3px 12px #b4756e1a}
.mine img{width:84px;height:100px;object-fit:cover;border-radius:10px}
.tg{padding:4px 12px;border-radius:14px;font-size:13px;color:#fff;background:#3bb35f}.tg.off{background:#b9a9a6}
.msgs{display:flex;flex-direction:column;gap:10px;margin:14px 0 80px}
.m{max-width:78%;padding:10px 14px;border-radius:16px;background:#fff;box-shadow:0 2px 6px #0001;align-self:flex-end}
.m.me{background:#e5bdb6;align-self:flex-start}
.m small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.sys{align-self:center;background:#f3dcd8;font-size:13px;color:var(--rose2)}
.send{position:fixed;bottom:66px;left:0;right:0;max-width:760px;margin:auto;padding:8px 14px;display:flex;gap:8px;background:var(--bg);z-index:4}
.ov{position:fixed;inset:0;background:#3b2a2999;display:grid;place-items:center;z-index:20;padding:16px}
.md{background:var(--bg);border-radius:22px;padding:24px;width:100%;max-width:380px;text-align:center}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#3b2a29;color:#fff;padding:10px 20px;border-radius:20px;z-index:30;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.ic svg{width:20px;height:20px;display:block}.heart svg{width:18px;height:18px;display:block}.btn svg,.pill svg{width:18px;height:18px;vertical-align:-3px;margin-inline-start:6px}
.mine{flex-wrap:wrap}.bigc{color:var(--rose);display:grid;place-items:center}.bigc svg{width:38px;height:38px}.vb{width:17px;height:17px;vertical-align:-3px;margin-inline-start:4px}
.sec{color:var(--mut);font-size:15px;margin:16px 0 8px;font-weight:700}
#sp{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#f7ebe8,#efd2cc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s}
#sp.out{opacity:0;pointer-events:none}#sp img{height:150px;animation:spin 1.3s ease-out both}
@keyframes spin{from{opacity:0;filter:blur(14px);transform:translateY(14px) scale(.94)}to{opacity:1;filter:blur(0);transform:none}}
#sp .bar{width:130px;height:4px;border-radius:4px;background:#e2c3bd;overflow:hidden}
#sp .bar i{display:block;height:100%;background:var(--grad);transform-origin:right;animation:fill 1.8s ease-in-out both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>

  <button class="heart" onclick="event.stopPropagation();fav('${d.id}')">${f?I.heartf:I.heart}</button>
  <h3>${esc(d.name)}</h3><small>المقاس: ${esc(d.size)} • ${esc((d.region||'').split(/[،,]/)[0])}</small>
  <div class="pr">${esc(d.price)} ج.م / يوم</div></div>`;
}
async function fav(id){
  if(!needLogin())return;
  const f=(prof.favs||[]).includes(id);
  prof.favs=f?prof.favs.filter(x=>x!==id):[...(prof.favs||[]),id];
  db.collection('users').doc(me.uid).update({favs:f?FV.arrayRemove(id):FV.arrayUnion(id)});
  const h=location.hash.slice(1)||'home';h.startsWith('dress')?dress(id):h==='favs'?favs():grid();
}
async function load(){const s=await db.collection('dresses').orderBy('createdAt','desc').limit(80).get();all=s.docs.map(d=>({id:d.id,...d.data()}))}

function grid(){
  const g=$('#gr');if(!g)return;
  const l=all.filter(d=>(!cat||d.category===cat)&&(!q||(d.name+d.region+d.color).includes(q)));
  g.innerHTML=l.length?l.map(card).join(''):'<p class="empty" style="grid-column:1/-1">لا توجد فساتين حالياً</p>';
}
async function favs(){
  shell('<h2>المفضلة</h2><div id="gr" class="grid"></div>','favs');
  if(!me){$('#gr').outerHTML='<p class="empty">سجلي دخولك لمشاهدة مفضلتك<br><br><button class="pill" onclick="openLogin()">تسجيل الدخول</button></p>';return}
  if(!all.length)await load();
  const l=all.filter(d=>(prof.favs||[]).includes(d.id));
  $('#gr').innerHTML=l.length?l.map(card).join(''):'<p class="empty" style="grid-column:1/-1">لم تضيفي فساتين للمفضلة بعد</p>';
}

/* ---------- add dress ---------- */
function add(){
  if(!me){shell('<p class="empty">سجلي دخولك لإضافة فستانك<br><br><button class="pill" onclick="openLogin()">تسجيل الدخول</button></p>','add');return}
  imgs=[];size='M';
  shell(`<h2 style="text-align:center">أضيفي فستانك للإيجار</h2>
  <label>رفع صور الفستان</label>
  <div class="up" onclick="$('#fi').click()"><div class="bigc">${I.cam}</div>تحميل صور الفستان (حتى ٥ صور)<div class="thumbs" id="th"><span class="ic">+</span></div></div>
  <input id="fi" type="file" accept="image/*" multiple hidden onchange="pick(this.files)">
  <label>اسم الفستان</label><input id="fn" class="in" placeholder="مثال: فستان سهرة مخملي">
  <label>القسم</label><select id="fc" class="in">${CATS.map(c=>`<option>${c[0]}</option>`).join('')}</select>
  <label>السعر اليومي (ج.م)</label><input id="fp" class="in" type="number" inputmode="numeric" placeholder="مثال: 500 ج.م">
  <label>المقاس</label><div class="sizes">${['S','M','L','XL','XXL'].map(s=>`<button class="sz ${s==='M'?'on':''}" onclick="size='${s}';document.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',b.textContent==='${s}'))">${s}</button>`).join('')}</div>
  <label>اللون</label><select id="fcl" class="in"><option value="">اختاري اللون</option>${COLORS.map(c=>`<option>${c}</option>`).join('')}</select>
  <div class="two"><div><label>الطول (سم)</label><input id="fh" class="in" type="number" inputmode="numeric"></div><div><label>الوزن المناسب (كجم)</label><input id="fw" class="in" placeholder="55-65"></div></div>
  <label>المحافظة والمنطقة</label><input id="fr" class="in" placeholder="مثال: القاهرة، مصر الجديدة" value="${esc(prof.city||'')}">
  <label>رقم التليفون / واتساب</label><input id="fph" class="in" dir="ltr" placeholder="01XXXXXXXXX" value="${esc(prof.phone||me.phoneNumber||'')}">
  <button id="pb" class="btn" onclick="publish()">نشر الفستان الآن</button>`,'add');
}
function shrink(f,m=720){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};i.src=u})}
async function pick(fl){
  for(const f of [...fl].slice(0,5-imgs.length))imgs.push(await shrink(f));
  $('#th').innerHTML=imgs.map(s=>`<img src="${s}">`).join('')+(imgs.length<5?'<span class="ic">+</span>':'');
}
async function publish(){
  const v=i=>$('#'+i).value.trim(),n=v('fn'),p=v('fp');
  if(!imgs.length)return toast('ارفعي صورة واحدة على الأقل');
  if(!n||!p)return toast('اكتبي اسم الفستان والسعر');
  const b=$('#pb');b.disabled=true;b.textContent='جاري النشر...';
  try{
    const r=await db.collection('dresses').add({ownerId:me.uid,ownerName:prof.name,name:n,category:v('fc'),price:+p,size,color:v('fcl'),height:v('fh'),weight:v('fw'),region:v('fr'),phone:v('fph'),images:imgs,available:true,createdAt:FV.serverTimestamp()});
    all=[];toast('تم نشر الفستان ✨');location.hash='#dress/'+r.id;
  }catch(e){console.error(e);toast('حدث خطأ، حاولي مرة أخرى');b.disabled=false;b.textContent='نشر الفستان الآن'}
}

async function openChat(id){

}

  <span class="avatar" onclick="editProfile()" style="width:70px;height:70px;font-size:28px;cursor:pointer">${av()}</span></div>

async function adminPanel(){

/* ---------- messages ---------- */
async function chats(){
  if(!me){shell('<p class="empty">سجلي دخولك لمشاهدة رسائلك<br><br><button class="pill" onclick="openLogin()">تسجيل الدخول</button></p>','chats');return}
  shell('<h2>الدردشات النشطة</h2><div id="cl"><p class="empty">جاري التحميل...</p></div>','chats',{title:'الرسائل'});
  const s=await db.collection('chats').where('participants','array-contains',me.uid).get();
  const l=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.lastMsg).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
  $('#cl').innerHTML=l.length?l.map(c=>`<a href="#chat/${c.id}" style="text-decoration:none;color:inherit"><div class="box row"><div style="display:flex;gap:10px;align-items:center"><span class="avatar" style="width:48px;height:48px">${esc(((c.ownerId===me.uid?c.renterName:c.ownerName)||'؟')[0])}</span><div><b>${esc(c.ownerId===me.uid?c.renterName:c.ownerName)}</b><div style="color:var(--mut);font-size:14px">${esc(c.dressName)} — ${esc(c.lastMsg).slice(0,40)}</div></div></div><img src="${c.dressImg}" style="width:44px;height:52px;border-radius:8px;object-fit:cover"></div></a>`).join(''):'<p class="empty">لا توجد محادثات بعد</p>';
}
async function chat(id){
  if(!me){return openLogin()}
  const ref=db.collection('chats').doc(id),s=await ref.get();if(!s.exists)return(location.hash='#chats');
  const c=s.data(),owner=c.ownerId===me.uid,who=owner?c.renterName:c.ownerName;
  shell(`<h2 style="text-align:center;margin-top:0">${esc(who)}</h2>
  <div class="box row"><div style="display:flex;gap:10px;align-items:center"><img src="${c.dressImg}" style="width:56px;height:68px;border-radius:10px;object-fit:cover"><div><b>${esc(c.dressName)}</b><div style="color:var(--mut);font-size:14px">${esc(c.price)} ج.م / يوم • المقاس: ${esc(c.size)}</div></div></div>
  ${owner&&!c.confirmed?`<button class="pill" style="background:var(--grad);color:#fff" onclick="confirmBook('${id}')">تأكيد الحجز</button>`:c.confirmed?'<span class="tg">تم الحجز ✓</span>':''}</div>
  <div class="msgs" id="ms"></div>
  <form class="send" onsubmit="return sendMsg(event,'${id}')"><input id="mi" class="in" placeholder="اكتبي رسالتك هنا..." autocomplete="off"><button class="ic" style="background:var(--grad);color:#fff;flex:0 0 42px;height:42px">${I.send}</button></form>`,'chats',{back:true});
  unsub=ref.collection('messages').orderBy('ts').onSnapshot(s=>{
    const m=$('#ms');if(!m)return;
    m.innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="m ${x.sys?'sys':x.from===me.uid?'me':''}">${esc(x.text)}${x.sys?'':`<small>${tm(x.ts)}</small>`}</div>`}).join('');
    window.scrollTo(0,document.body.scrollHeight);
  });
}
async function sendMsg(e,id){
  e.preventDefault();const i=$('#mi'),t=i.value.trim();if(!t)return false;i.value='';
  const ref=db.collection('chats').doc(id);
  await ref.collection('messages').add({from:me.uid,text:t,ts:FV.serverTimestamp()});
  ref.update({lastMsg:t,updatedAt:FV.serverTimestamp()});return false;
}
async function confirmBook(id){
  const ref=db.collection('chats').doc(id);
  await ref.update({confirmed:true,lastMsg:'تم تأكيد الحجز ✅',updatedAt:FV.serverTimestamp()});
  await ref.collection('messages').add({from:me.uid,sys:true,text:'تم تأكيد الحجز ✅',ts:FV.serverTimestamp()});chat(id);
}
</script>
<script type="module">
/* Firebase (modular SDK) + واجهة متوافقة مع باقي الكود. التخزين على localStorage بدل IndexedDB عشان Safari */
/* لو خادم الدخول الأساسي مش بيرد من شبكتك، نحوّل نفس الطلب لعنوان Google القديم (www.googleapis.com) */
const _f=window.fetch.bind(window),H='https://identitytoolkit.googleapis.com/v1/accounts:',MP={signInWithPassword:'verifyPassword',signUp:'signupNewUser',lookup:'getAccountInfo',update:'setAccountInfo',sendOobCode:'getOobConfirmationCode'};
window.fetch=async(input,init)=>{
  const url=typeof input==='string'?input:(input&&input.url)||'';
  if(!url.startsWith(H))return _f(input,init);
  const rest=url.slice(H.length),q=rest.indexOf('?'),name=q<0?rest:rest.slice(0,q),qs=q<0?'':rest.slice(q);

  const altInit=()=>({method:(init&&init.method)||'POST',headers:{'Content-Type':'application/json'},body:init&&init.body});
  if(window.__authAlt)return _f(alt,altInit());
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),5000);
  try{const r=await _f(input,{...init,signal:ctl.signal});clearTimeout(t);return r}
  catch(e){clearTimeout(t);window.__authAlt=1;return _f(alt,altInit())}
};
const B='https://www.gstatic.com/firebasejs/10.12.2/';
let A,AU,FS;
try{[A,AU,FS]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')])}catch(e){console.error('Firebase load failed',e)}
if(A){
  let app,auth,fs;
  const wrap=u=>{if(u&&!u.updateProfile)u.updateProfile=o=>AU.updateProfile(u,o);return u};
  const snapD=d=>({id:d.id,exists:d.exists?d.exists():true,data:()=>d.data()});
  const docF=path=>{const ref=()=>FS.doc(fs,...path);return{
    async get(){return snapD(await FS.getDoc(ref()))},
    set:(d,o)=>o?FS.setDoc(ref(),d,o):FS.setDoc(ref(),d),update:d=>FS.updateDoc(ref(),d),delete:()=>FS.deleteDoc(ref()),
    collection:n=>collF([...path,n])}};
  const collF=(path,c=[])=>{const q=()=>FS.query(FS.collection(fs,...path),...c);return{
    where:(f,o,v)=>collF(path,[...c,FS.where(f,o,v)]),orderBy:(f,d)=>collF(path,[...c,FS.orderBy(f,d)]),limit:n=>collF(path,[...c,FS.limit(n)]),
    async get(){const s=await FS.getDocs(q());return{docs:s.docs.map(snapD)}},
    onSnapshot:cb=>FS.onSnapshot(q(),s=>cb({docs:s.docs.map(snapD)}),e=>console.error(e)),
    async add(d){const r=await FS.addDoc(FS.collection(fs,...path),d);return{id:r.id}},doc:id=>docF([...path,id])}};
  const authF={set languageCode(v){auth.languageCode=v},get currentUser(){return wrap(auth.currentUser)},
    onAuthStateChanged:cb=>AU.onAuthStateChanged(auth,u=>cb(wrap(u))),
    async createUserWithEmailAndPassword(e,p){const c=await AU.createUserWithEmailAndPassword(auth,e,p);return{user:wrap(c.user)}},
    signInWithEmailAndPassword:(e,p)=>AU.signInWithEmailAndPassword(auth,e,p),sendPasswordResetEmail:e=>AU.sendPasswordResetEmail(auth,e),signOut:()=>AU.signOut(auth)};
  const dbF={settings(){},collection:n=>collF([n])};
  window.firebase={
    initializeApp(cfg){
      app=A.initializeApp(cfg);
      auth=AU.initializeAuth(app,{persistence:[AU.browserLocalPersistence,AU.browserSessionPersistence,AU.inMemoryPersistence]});
      fs=FS.initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
      import(B+'firebase-analytics.js').then(m=>m.getAnalytics(app)).catch(()=>{});
    },
    auth:()=>authF,
    firestore:Object.assign(()=>dbF,{FieldValue:{serverTimestamp:FS.serverTimestamp,arrayUnion:FS.arrayUnion,arrayRemove:FS.arrayRemove,delete:FS.deleteField}})
  };
  window.__fbReal=1;
}
const s=document.createElement('script');s.textContent=document.getElementById('main').textContent;document.body.append(s);
</script>
